<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Logo Image Effects Editor</title>
<link rel="icon" type="Logo.png" href="Logo.png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

    :root {
      --bg-color: #0b101a;
      --card-bg: #151d2b;
      --card-hover: #1e293b;
      --text-main: #ffffff;
      --text-muted: #8a9bb2;
      --accent: #10b4c5;
      --accent-hover: #0e9ba8;
      --border: #243146;
      --danger: #ef5350;
      --success: #10b981;
      --sidebar-width: 340px;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-size: 13px;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #444; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }

    /* Layout */
    .sidebar {
      width: var(--sidebar-width);
      background-color: var(--card-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100%;
      z-index: 10;
      box-shadow: 2px 0 20px rgba(0,0,0,0.3);
    }

    .sidebar-header {
      padding: 24px 24px 16px;
      border-bottom: 1px solid var(--border);
    }

    .sidebar-header h2 {
      margin: 0;
      font-weight: 600;
      font-size: 18px;
      letter-spacing: -0.02em;
    }

    .sidebar-header .subtitle {
      margin: 6px 0 0 0;
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .sidebar-content {
      padding: 20px 24px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .main-workspace {
      flex: 1;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-color);
      position: relative;
    }

    .top-bar {
      height: 64px;
      padding: 0 32px;
      background: rgba(21, 29, 43, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: absolute;
      top: 0; left: 0; right: 0;
      z-index: 5;
    }

    .canvas-wrapper {
      flex: 1;
      padding: 80px 40px 40px; /* Offset for absolute top-bar */
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background-image: 
        linear-gradient(45deg, #101623 25%, transparent 25%), 
        linear-gradient(-45deg, #101623 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #101623 75%), 
        linear-gradient(-45deg, transparent 75%, #101623 75%);
      background-size: 24px 24px;
      background-position: 0 0, 0 12px, 12px -12px, -12px 0px;
    }

    canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      box-shadow: 0 24px 48px rgba(0,0,0,0.6), 0 0 0 1px var(--border);
      border-radius: var(--radius-sm);
    }

    /* Controls */
    .control-group {
      background: var(--bg-color);
      border-radius: var(--radius-md);
      padding: 16px;
      border: 1px solid var(--border);
      transition: border-color 0.2s;
    }
    
    .control-group:hover {
      border-color: #3f3f46;
    }

    .group-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .group-header h3 {
      margin: 0;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-main);
    }

    .upload-box {
      margin-bottom: 16px;
    }
    .file-input { display: none; }
    .upload-label {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      background: var(--bg-color);
      border: 1px solid var(--border);
      padding: 14px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
      color: var(--text-muted);
    }
    .upload-label:hover {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }

    .slider-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 12px;
      margin-top: 12px;
      color: var(--text-muted);
      align-items: center;
    }
    
    .val-input {
      background: var(--bg-color);
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 6px;
      padding: 6px 8px;
      width: 54px;
      text-align: right;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
    }
    .val-input:focus {
      outline: none;
      border-color: var(--accent);
    }
    
    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      outline: none;
      margin-bottom: 8px;
    }
    
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--text-main);
      cursor: pointer;
      border: 2px solid var(--card-bg);
      box-shadow: 0 0 0 1.5px var(--border);
      transition: transform 0.1s;
    }
    
    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
      background: var(--accent);
      border-color: var(--accent);
    }

    input[type="color"] {
      -webkit-appearance: none;
      border: 1px solid var(--border);
      width: 28px;
      height: 28px;
      padding: 0;
      border-radius: 50%;
      background: none;
      cursor: pointer;
      overflow: hidden;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 50%; }

    .color-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Toggle Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 32px;
      height: 18px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--border); transition: .3s; border-radius: 18px;
    }
    .slider:before {
      position: absolute; content: ""; height: 14px; width: 14px; left: 2px; bottom: 2px;
      background-color: white; transition: .3s; border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--accent); }
    input:checked + .slider:before { transform: translateX(14px); }

    .nested-controls { transition: opacity 0.3s; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border); }
    .disabled { opacity: 0.4; pointer-events: none; }

    /* Buttons */
    button { font-family: inherit; }
    
    .action-btn, .download-btn {
      width: 100%;
      padding: 12px 20px;
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(16, 180, 197, 0.25);
    }
    
    .action-btn:hover, .download-btn:hover { 
      background: var(--accent-hover); 
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(16, 180, 197, 0.35);
    }
    
    .action-btn:active, .download-btn:active { 
      transform: translateY(0); 
    }

    .download-btn {
      width: auto;
      margin-top: 0;
    }

    .sm-btn {
      background: transparent; border: 1px solid var(--border); color: var(--text-muted);
      padding: 4px 10px; border-radius: var(--radius-sm); font-size: 11px; cursor: pointer;
      transition: all 0.2s;
    }
    .sm-btn:hover { border-color: var(--text-main); color: var(--text-main); background: var(--card-hover); }

    /* Empty state */
    #emptyState {
      position: absolute;
      text-align: center;
      color: var(--text-muted);
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    #emptyState svg { width: 48px; height: 48px; fill: var(--border); }
    #emptyState h2 { margin: 0; font-size: 16px; font-weight: 500; color: #555; }
  </style>
</head>
<body>

  <!-- LEFT SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>Image Studio Pro</h2>
      <p class="subtitle">Edit backgrounds, adjust, and add effects.</p>
    </div>

    <div class="sidebar-content">
      
      <!-- FOREGROUND SECTION -->
      <div class="control-group">
        <div class="group-header">
          <h3>1. Main Image (Foreground)</h3>
        </div>
        <div class="upload-box">
          <input type="file" id="upload" accept="image/*" class="file-input" />
          <label for="upload" class="upload-label">
            <span>📁 Upload Foreground Image</span>
          </label>
        </div>

        <div class="slider-row">
          <label>Scale</label>
          <input type="number" class="val-input" id="val-scale" step="0.05" value="1" />
        </div>
        <input type="range" id="scale" min="0.1" max="3" step="0.05" value="1" />

        <div class="slider-row">
          <label>Position X</label>
          <input type="number" class="val-input" id="val-fgX" value="0" />
        </div>
        <input type="range" id="fgX" min="-1000" max="1000" value="0" />

        <div class="slider-row">
          <label>Position Y</label>
          <input type="number" class="val-input" id="val-fgY" value="0" />
        </div>
        <input type="range" id="fgY" min="-1000" max="1000" value="0" />
      </div>

      <!-- BACKGROUND SETTINGS -->
      <div class="control-group">
        <div class="group-header">
          <h3>2. Background Layer</h3>
          <button id="clearBgBtn" class="sm-btn">🗑️ Clear</button>
        </div>
        <div class="upload-box">
          <input type="file" id="uploadBg" accept="image/*" class="file-input" />
          <label for="uploadBg" class="upload-label">
            <span>🖼️ Upload Background Image</span>
          </label>
        </div>
        <div class="color-row">
          <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
            <input type="checkbox" id="bgTransparent" checked>
            Transparent Color
          </label>
          <input type="color" id="bgLayerColor" value="#000000" title="Solid Color (Uncheck Transparent)">
        </div>
      </div>

      <!-- IMAGE ADJUSTMENTS (CANVA LIKE) -->
      <div class="control-group">
        <div class="group-header">
          <h3>3. Adjustments</h3>
        </div>
        <div class="slider-row">
          <label>Brightness (%)</label>
          <input type="number" class="val-input" id="val-brightness" value="100" />
        </div>
        <input type="range" id="brightness" min="0" max="200" value="100" />

        <div class="slider-row">
          <label>Contrast (%)</label>
          <input type="number" class="val-input" id="val-contrast" value="100" />
        </div>
        <input type="range" id="contrast" min="0" max="200" value="100" />

        <div class="slider-row">
          <label>Saturation (%)</label>
          <input type="number" class="val-input" id="val-saturation" value="100" />
        </div>
        <input type="range" id="saturation" min="0" max="200" value="100" />
      </div>

      <!-- BACKGROUND REMOVER SECTION -->
      <div class="control-group">
        <div class="group-header">
          <h3>4. Auto Background Remover</h3>
          <button id="resetBgRemovalBtn" class="sm-btn">↺ Reset</button>
        </div>
        <div class="color-row">
             <label>Target Color to Remove</label>
             <input type="color" id="bgColorTarget" value="#ffffff">
        </div>
        <div class="slider-row">
          <label>Tolerance</label>
          <input type="number" class="val-input" id="val-tolerance" value="40" />
        </div>
        <input type="range" id="tolerance" min="1" max="200" value="40" />
        <button id="removeBgBtn" class="action-btn">✨ Remove Selected Color</button>
      </div>
      
      <!-- STROKE SECTION -->
      <div class="control-group">
        <div class="group-header">
          <h3>5. Outline / Stroke</h3>
          <input type="color" id="strokeColor" value="#ffffff" title="Stroke Color">
        </div>
        <div class="slider-row">
          <label>Thickness (px)</label>
          <input type="number" class="val-input" id="val-strokeSize" value="0" />
        </div>
        <input type="range" id="strokeSize" min="0" max="50" value="0" />
      </div>

      <!-- SHADOW SECTION -->
      <div class="control-group">
        <div class="group-header">
          <h3>6. Drop Shadow</h3>
          <label class="switch">
            <input type="checkbox" id="shadowToggle" checked>
            <span class="slider round"></span>
          </label>
        </div>
        <div id="shadowControls" class="nested-controls">
          <div class="color-row">
             <label>Color</label>
             <input type="color" id="shadowColor" value="#000000">
          </div>
          <div class="slider-row">
            <label>Blur (px)</label>
            <input type="number" class="val-input" id="val-shadowBlur" value="10" />
          </div>
          <input type="range" id="shadowBlur" min="0" max="150" value="10" />
          <div class="slider-row">
            <label>Position X</label>
            <input type="number" class="val-input" id="val-shadowX" value="0" />
          </div>
          <input type="range" id="shadowX" min="-100" max="100" value="0" />
          <div class="slider-row">
            <label>Position Y</label>
            <input type="number" class="val-input" id="val-shadowY" value="0" />
          </div>
          <input type="range" id="shadowY" min="-100" max="100" value="0" />
        </div>
      </div>

    </div>
  </aside>

  <!-- MAIN WORKSPACE -->
  <main class="main-workspace">
    <div class="top-bar">
      <div><span style="color:var(--text-muted);">Status: </span><span id="statusText" style="color:var(--success);">Ready</span></div>
      <button id="downloadBtn" class="download-btn">📥 Download Output</button>
    </div>

    <div class="canvas-wrapper">
      <div id="emptyState">
        <svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>
        <h2>Upload an Image to Begin</h2>
      </div>
      <canvas id="canvas"></canvas>
    </div>
  </main>

  <script>
    // --- DOM ELEMENTS ---
    const upload = document.getElementById("upload");
    const uploadBg = document.getElementById("uploadBg");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const downloadBtn = document.getElementById("downloadBtn");
    const emptyState = document.getElementById("emptyState");
    const statusText = document.getElementById("statusText");

    // Transform Controls
    const scaleInput = document.getElementById("scale");
    const fgXInput = document.getElementById("fgX");
    const fgYInput = document.getElementById("fgY");
    const valScale = document.getElementById("val-scale");
    const valFgX = document.getElementById("val-fgX");
    const valFgY = document.getElementById("val-fgY");

    // Background Controls
    const bgLayerColor = document.getElementById("bgLayerColor");
    const bgTransparent = document.getElementById("bgTransparent");
    const clearBgBtn = document.getElementById("clearBgBtn");

    // Adjustments
    const brightnessInput = document.getElementById("brightness");
    const contrastInput = document.getElementById("contrast");
    const saturationInput = document.getElementById("saturation");
    const valBrightness = document.getElementById("val-brightness");
    const valContrast = document.getElementById("val-contrast");
    const valSaturation = document.getElementById("val-saturation");

    // BG Remover Controls
    const bgColorTarget = document.getElementById("bgColorTarget");
    const toleranceInput = document.getElementById("tolerance");
    const valTolerance = document.getElementById("val-tolerance");
    const removeBgBtn = document.getElementById("removeBgBtn");
    const resetBgRemovalBtn = document.getElementById("resetBgRemovalBtn");

    // Stroke Controls
    const strokeSize = document.getElementById("strokeSize");
    const strokeColor = document.getElementById("strokeColor");
    const valStrokeSize = document.getElementById("val-strokeSize");

    // Shadow Controls
    const shadowToggle = document.getElementById("shadowToggle");
    const shadowControls = document.getElementById("shadowControls");
    const shadowBlur = document.getElementById("shadowBlur");
    const shadowX = document.getElementById("shadowX");
    const shadowY = document.getElementById("shadowY");
    const shadowColor = document.getElementById("shadowColor");

    // Shadow Value Displays
    const valShadowBlur = document.getElementById("val-shadowBlur");
    const valShadowX = document.getElementById("val-shadowX");
    const valShadowY = document.getElementById("val-shadowY");

    // --- STATE VARIABLES ---
    let originalImage = null;       // Raw uploaded foreground image
    let cachedCutoutCanvas = null;  // Buffer holding foreground after BG removal (to optimize render speed)
    let bgImageObj = null;          // Uploaded background image

    // --- INITIALIZATION ---
    function init() {
        // Map sliders to their manual input counterparts
        const syncPairs = [
            ['scale', 'val-scale'],
            ['fgX', 'val-fgX'],
            ['fgY', 'val-fgY'],
            ['brightness', 'val-brightness'],
            ['contrast', 'val-contrast'],
            ['saturation', 'val-saturation'],
            ['tolerance', 'val-tolerance'],
            ['strokeSize', 'val-strokeSize'],
            ['shadowBlur', 'val-shadowBlur'],
            ['shadowX', 'val-shadowX'],
            ['shadowY', 'val-shadowY']
        ];

        syncPairs.forEach(([sliderId, inputId]) => {
            const slider = document.getElementById(sliderId);
            const input = document.getElementById(inputId);
            
            // Slider to Input
            slider.addEventListener('input', () => {
                input.value = slider.value;
                draw();
            });
            
            // Input to Slider
            input.addEventListener('input', () => {
                slider.value = input.value;
                draw();
            });
        });

        // Other UI update listeners
        bgLayerColor.addEventListener("input", draw);
        bgTransparent.addEventListener("change", draw);
        strokeColor.addEventListener("input", draw);
        shadowColor.addEventListener("input", draw);
        bgColorTarget.addEventListener("input", draw);
        
        shadowToggle.addEventListener("change", () => {
            if (shadowToggle.checked) {
                shadowControls.classList.remove("disabled");
            } else {
                shadowControls.classList.add("disabled");
            }
            draw();
        });
        
        // Actions
        upload.addEventListener("change", handleForegroundUpload);
        uploadBg.addEventListener("change", handleBackgroundUpload);
        clearBgBtn.addEventListener("click", clearBackgroundImage);
        downloadBtn.addEventListener("click", downloadImage);
        removeBgBtn.addEventListener("click", applyBackgroundRemoval);
        resetBgRemovalBtn.addEventListener("click", resetBackgroundRemoval);
    }

    // --- HANDLERS ---
    function handleForegroundUpload(e) {
        const file = e.target.files[0];
        if (!file) return;

        const img = new Image();
        img.onload = () => {
            originalImage = img;
            
            // Set dynamic limits for translation based on image size
            fgXInput.min = -img.width;
            fgXInput.max = img.width;
            fgYInput.min = -img.height;
            fgYInput.max = img.height;

            // Reset transform for new image
            scaleInput.value = 1; document.getElementById("val-scale").value = 1;
            fgXInput.value = 0;   document.getElementById("val-fgX").value = 0;
            fgYInput.value = 0;   document.getElementById("val-fgY").value = 0;

            emptyState.style.display = "none";
            
            // Set initial cutout buffer to the original image
            resetBackgroundRemoval(); 
        };
        img.src = URL.createObjectURL(file);
    }

    function handleBackgroundUpload(e) {
        const file = e.target.files[0];
        if (!file) return;
        const img = new Image();
        img.onload = () => {
            bgImageObj = img;
            draw();
        };
        img.src = URL.createObjectURL(file);
    }

    function clearBackgroundImage() {
        bgImageObj = null;
        uploadBg.value = "";
        draw();
    }

    // --- PROCESSING LOGIC ---

    // Restores the original uploaded image without the background removed
    function resetBackgroundRemoval() {
        if (!originalImage) return;
        
        cachedCutoutCanvas = document.createElement("canvas");
        cachedCutoutCanvas.width = originalImage.width;
        cachedCutoutCanvas.height = originalImage.height;
        const cCtx = cachedCutoutCanvas.getContext("2d");
        cCtx.drawImage(originalImage, 0, 0);
        
        statusText.textContent = "Original Image Restored";
        draw();
    }

    // Runs Euclidean color distance to strip out the background matching the Target Color
    function applyBackgroundRemoval() {
        if (!originalImage) return;

        statusText.textContent = "Processing Background Removal...";
        statusText.style.color = "#ffca28"; // Warning color while working

        // Use a short timeout to allow the browser to update the UI "Processing..." text
        setTimeout(() => {
            const tempCanvas = document.createElement("canvas");
            tempCanvas.width = originalImage.width;
            tempCanvas.height = originalImage.height;
            const tempCtx = tempCanvas.getContext("2d");

            // Always process from the raw original image
            tempCtx.drawImage(originalImage, 0, 0);

            const frame = tempCtx.getImageData(0, 0, tempCanvas.width, tempCanvas.height);
            const data = frame.data;

            // Get Target Color (Hex to RGB)
            const hex = bgColorTarget.value;
            const rT = parseInt(hex.slice(1, 3), 16);
            const gT = parseInt(hex.slice(3, 5), 16);
            const bT = parseInt(hex.slice(5, 7), 16);
            
            const thresh = parseInt(toleranceInput.value);

            // Euclidean Distance Pixel Matching
            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                const a = data[i + 3];

                if (a > 0) { // Only check non-transparent pixels
                    const dist = Math.sqrt(
                        Math.pow(r - rT, 2) + 
                        Math.pow(g - gT, 2) + 
                        Math.pow(b - bT, 2)
                    );

                    if (dist < thresh) {
                        data[i + 3] = 0; // Set Alpha to 0 (Transparent)
                    }
                }
            }

            tempCtx.putImageData(frame, 0, 0);

            // Save this to our cache canvas
            cachedCutoutCanvas = tempCanvas;
            
            statusText.textContent = "Background Removed!";
            statusText.style.color = "var(--success)";
            
            draw();
        }, 50);
    }

    // Creates a solid silhouette of an image for the Stroke effect
    function createSilhouette(imgCanvas, color, width, height) {
        const sCanvas = document.createElement("canvas");
        sCanvas.width = width;
        sCanvas.height = height;
        const sCtx = sCanvas.getContext("2d");

        sCtx.drawImage(imgCanvas, 0, 0);
        sCtx.globalCompositeOperation = "source-in";
        sCtx.fillStyle = color;
        sCtx.fillRect(0, 0, width, height);

        return sCanvas;
    }

    // --- MAIN RENDER PIPELINE ---
    function draw() {
        if (!originalImage || !cachedCutoutCanvas) return;

        // 1. Establish Canvas Artboard Size based on Foreground Original Size
        // This ensures high-res outputs regardless of UI scaling
        const cw = originalImage.width;
        const ch = originalImage.height;
        canvas.width = cw;
        canvas.height = ch;

        // Clear Main Canvas completely
        ctx.clearRect(0, 0, cw, ch);

        // 2. Render Layer 1: Background Color
        if (!bgTransparent.checked) {
            ctx.fillStyle = bgLayerColor.value;
            ctx.fillRect(0, 0, cw, ch);
        }

        // 3. Render Layer 2: Background Image (if any)
        if (bgImageObj) {
            // Draw background image scaled to cover the canvas
            const bgScale = Math.max(cw / bgImageObj.width, ch / bgImageObj.height);
            const bx = (cw / 2) - (bgImageObj.width / 2) * bgScale;
            const by = (ch / 2) - (bgImageObj.height / 2) * bgScale;
            ctx.drawImage(bgImageObj, bx, by, bgImageObj.width * bgScale, bgImageObj.height * bgScale);
        }

        // 4. Prepare Layer 3: Foreground (with Filters)
        const filteredCanvas = document.createElement("canvas");
        filteredCanvas.width = cw;
        filteredCanvas.height = ch;
        const fCtx = filteredCanvas.getContext("2d");
        
        // Apply Canva-like adjustments (Brightness, Contrast, Saturation)
        fCtx.filter = `brightness(${brightnessInput.value}%) contrast(${contrastInput.value}%) saturate(${saturationInput.value}%)`;
        fCtx.drawImage(cachedCutoutCanvas, 0, 0);

        // 5. Prepare Stroke Buffer
        const strokeBuffer = document.createElement("canvas");
        strokeBuffer.width = cw;
        strokeBuffer.height = ch;
        const bCtx = strokeBuffer.getContext("2d");

        const sSize = parseInt(strokeSize.value);
        if (sSize > 0) {
            // Create silhouette from the FILTERED canvas to match boundaries exactly
            const silhouette = createSilhouette(filteredCanvas, strokeColor.value, cw, ch);
            
            // Draw stroke circularly
            const angles = 32; 
            for (let i = 0; i < angles; i++) {
                const angle = (i * 2 * Math.PI) / angles;
                const offsetX = Math.cos(angle) * sSize;
                const offsetY = Math.sin(angle) * sSize;
                bCtx.drawImage(silhouette, offsetX, offsetY);
            }
        }

        // Draw main filtered foreground on top of the stroke inside the buffer
        bCtx.drawImage(filteredCanvas, 0, 0);

        // 6. Draw the Final Foreground Buffer onto Main Canvas with Transforms & Shadow
        ctx.save();
        
        // Apply Transforms (Translate center, scale, translate back + custom offset)
        const tScale = parseFloat(scaleInput.value);
        const tX = parseInt(fgXInput.value);
        const tY = parseInt(fgYInput.value);

        // Move to center + offset, scale, then draw image offset by half its size
        ctx.translate((cw / 2) + tX, (ch / 2) + tY);
        ctx.scale(tScale, tScale);

        // Apply Drop Shadow to the entire composed Foreground unit
        if (shadowToggle.checked) {
            ctx.shadowColor = shadowColor.value;
            ctx.shadowBlur = parseInt(shadowBlur.value);
            ctx.shadowOffsetX = parseInt(shadowX.value);
            ctx.shadowOffsetY = parseInt(shadowY.value);
        }
        
        // Draw the composed foreground buffer
        ctx.drawImage(strokeBuffer, -cw / 2, -ch / 2);
        ctx.restore();
    }

    // --- DOWNLOAD ---
    function downloadImage() {
        if (!originalImage) return;
        const link = document.createElement("a");
        link.download = "studio-edit.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
    }

    // Boot up
    init();
  </script>
</body>
